[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "wechat-reply-agent"
version = "0.1.0"
description = "Local macOS WeChat reply agent with explicit sending gates"
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.12,<3", "pydantic-settings>=2.11,<3"]

[project.optional-dependencies]
mac = [
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
  "Pillow>=11,<13; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.16"]

[project.scripts]
wechat-agent = "wechat_reply_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

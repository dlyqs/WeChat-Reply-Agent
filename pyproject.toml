[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "wechat-reply-agent"
version = "0.1.0"
description = "Local WeChat reply agent with explicit sending gates"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.12,<3", "pydantic-settings>=2.11,<3", "langgraph>=1,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
windows = ["wechatauto-replica==1.2.7.0; sys_platform == 'win32'"]
mac = [
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
  "Pillow>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-vision>=11,<13 ; sys_platform == 'darwin'",
]

[tool.uv.sources]
wechatauto-replica = { path = "third_party/wechatauto_replica" }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.16"]

[project.scripts]
wechat-agent = "wechat_reply_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/third_party/wechatauto_replica", "/docs", "/scripts", "/tests", "/examples", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/.env.example"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
